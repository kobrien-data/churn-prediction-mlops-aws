name: Customer Churn Workflow
run-name:
on:
  push:
    branches:
      - main
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install "sagemaker>=2.200.0"
          pip install -r requirements.txt
          pip install --upgrade "sagemaker>=2.200.0"
      - name: Lint with flake8
        run: flake8 src/
      - name: Run tests
        run: pytest tests/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Check sagemaker version
        run: pip show sagemaker
      - name: Run SageMaker pipeline
        run: python src/pipeline/pipeline.py
        env:
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          TRAINING_IMAGE_URI: ${{ secrets.TRAINING_IMAGE_URI }}
          S3_RAW_DATA_BUCKET: ${{ secrets.S3_RAW_DATA_BUCKET }}
          S3_PROCESSED_DATA_BUCKET: ${{ secrets.S3_PROCESSED_DATA_BUCKET }}
          S3_MODEL_ARTIFACTS_BUCKET: ${{ secrets.S3_MODEL_ARTIFACTS_BUCKET }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      